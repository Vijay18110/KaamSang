services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - kaamsang_mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1:27017 --eval
          'try { if (rs.status().ok !== 1) quit(1) } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}); quit(1) }'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  kaamsang_mongo:
